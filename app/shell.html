<title>Orbique</title>
<meta name="theme-color" content="#0F1B2D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/*CORE_CSS*/
</style>
<!--PAGE_CSS-->
<div id="guest-root" class="guest-root" hidden></div>
<div id="app" aria-busy="true">
  <div class="scrim"></div>
  <div class="shell">
    <aside class="side" aria-label="Main menu">
      <div class="side-top">
        <div class="ws">
          <button class="ws-btn" id="ws-btn" type="button" aria-haspopup="true"><span class="ws-logo" id="ws-logo"></span><span class="grow"><span class="ws-name" id="ws-name" style="display:block"></span><span class="ws-sub" id="ws-sub" style="display:block"></span></span><span class="ws-caret">▾</span></button>
          <div class="ws-menu" id="ws-menu"></div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">
        <button class="viewer-btn" id="viewer-btn" type="button" aria-haspopup="true"></button>
        <div class="viewer-menu" id="viewer-menu"></div>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Open menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div class="tb-title"><h1 id="tb-title"></h1><div class="tb-desc" id="tb-desc"></div></div>
        <span class="sync-pill" id="sync-pill" hidden></span>
        <div class="tb-actions" id="tb-actions"></div>
        <div class="tb-global">
          <button class="icon-btn" id="lock-btn" type="button" title="Change a door code" aria-label="Change a door code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2M17 6l3 3M14 9l2 2"/></svg></button>
          <div class="pop"><button class="icon-btn" id="bell-btn" type="button" aria-label="Notifications"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot"></span></button><div class="pop-menu" id="bell-menu"></div></div>
          <div class="pop"><button class="icon-btn" id="lang-btn" type="button" aria-label="Language"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg></button><div class="pop-menu" id="lang-menu"></div></div>
        </div>
      </header>
      <main class="content"><div id="page-root" class="page-root"></div></main>
      <nav class="tabbar" id="tabbar" aria-label="Quick menu"></nav>
    </div>
  </div>
  <div class="toasts" role="status" aria-live="polite"></div>
</div>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!--SCRIPTS-->
