apply plugin: 'com.android.application'

// Version numbers and the Google Play upload key come from environment variables, so CI can set them without
// editing this file (see docs/MOBILE.md):
//   ORBIQUE_VERSION_CODE   whole number that must go up with every Google Play upload (CI uses its build number). Default 1.
//   ORBIQUE_VERSION_NAME   the version people see, such as 0.5.0. Default 0.5.0.
//   ORBIQUE_KEYSTORE_FILE, ORBIQUE_KEYSTORE_PASSWORD, ORBIQUE_KEY_ALIAS, ORBIQUE_KEY_PASSWORD
//                          the upload key (use a full path for the file). Used only when all four are set; otherwise the
//                          release build stays unsigned and still builds.
//   ORBIQUE_TEST_KEYSTORE  full path of the test key that signs the beta build (alias androiddebugkey, store and key
//                          password android). CI sets it. Unset: beta, like debug, uses Android's own debug key.
// Build types: debug (developers: debuggable, WebView inspection on), beta (the published test APK: the release build,
// not debuggable, signed with the test key so it installs without Google Play), release (Google Play upload).
def orbiqueEnv = { String name ->
    def value = System.getenv(name)
    return (value != null && !value.trim().isEmpty()) ? value : null
}
def orbiqueVersionCode = (orbiqueEnv('ORBIQUE_VERSION_CODE') ?: '1').trim()
if (!(orbiqueVersionCode ==~ /[1-9][0-9]{0,9}/) || orbiqueVersionCode.toLong() > 2100000000L) {
    throw new GradleException("ORBIQUE_VERSION_CODE must be a whole number from 1 to 2100000000 (got '${orbiqueVersionCode}').")
}
def orbiqueVersionName = (orbiqueEnv('ORBIQUE_VERSION_NAME') ?: '0.5.0').trim()
def orbiqueSigningNames = ['ORBIQUE_KEYSTORE_FILE', 'ORBIQUE_KEYSTORE_PASSWORD', 'ORBIQUE_KEY_ALIAS', 'ORBIQUE_KEY_PASSWORD']
def orbiqueSigningMissing = orbiqueSigningNames.findAll { orbiqueEnv(it) == null }
def orbiqueReleaseSigning = orbiqueSigningMissing.isEmpty()
def orbiqueTestKeystore = orbiqueEnv('ORBIQUE_TEST_KEYSTORE')
if (orbiqueTestKeystore != null && !file(orbiqueTestKeystore).isFile()) {
    throw new GradleException("ORBIQUE_TEST_KEYSTORE is set to '${orbiqueTestKeystore}', but there is no file there.")
}
if (!orbiqueReleaseSigning && orbiqueSigningMissing.size() < orbiqueSigningNames.size()) {
    logger.warn("Orbique: release signing is off because ${orbiqueSigningMissing.join(', ')} not set; the release build will be unsigned.")
}

android {
    namespace = "com.orbique.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.orbique.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode = orbiqueVersionCode.toInteger()
        versionName = orbiqueVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (orbiqueTestKeystore != null) {
            orbiqueTest {
                storeFile = file(orbiqueTestKeystore)
                storePassword = 'android'
                keyAlias = 'androiddebugkey'
                keyPassword = 'android'
            }
        }
        if (orbiqueReleaseSigning) {
            release {
                storeFile = file(orbiqueEnv('ORBIQUE_KEYSTORE_FILE'))
                storePassword = orbiqueEnv('ORBIQUE_KEYSTORE_PASSWORD')
                keyAlias = orbiqueEnv('ORBIQUE_KEY_ALIAS')
                keyPassword = orbiqueEnv('ORBIQUE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (orbiqueReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
        beta {
            initWith release
            debuggable false
            signingConfig = orbiqueTestKeystore != null ? signingConfigs.orbiqueTest : signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
